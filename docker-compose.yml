
services:
  postgres:
    image: postgres:17-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksphere_user
      POSTGRES_PASSWORD: worksphere_password
      POSTGRES_DB: worksphere
    ports:
      - "5432:5432"
    volumes:
      - worksphere_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksphere_user -d worksphere"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  worksphere_postgres_data:
